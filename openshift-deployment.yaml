---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: sre-simulator
  labels:
    app: openshift-sre-simulator

---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-simulator
  namespace: sre-simulator
  labels:
    app: sre-simulator
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: sre-simulator
  template:
    metadata:
      labels:
        app: sre-simulator
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
    spec:
      # Security Context for the pod
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      
      # Service Account
      serviceAccountName: sre-simulator
      
      containers:
      - name: sre-simulator
        image: image-registry.openshift-image-registry.svc:5000/sre-simulator/sre-simulator:latest
        imagePullPolicy: Always
        
        # Container security context
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
        
        # Ports
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        
        # Environment variables
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        
        # Resource requests and limits
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        
        # Liveness probe
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        
        # Readiness probe
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 2
        
        # Volume mounts
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/.cache
      
      # Volumes
      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
      
      # Pod disruption budget
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - sre-simulator
              topologyKey: kubernetes.io/hostname

---
# Service
apiVersion: v1
kind: Service
metadata:
  name: sre-simulator
  namespace: sre-simulator
  labels:
    app: sre-simulator
spec:
  type: ClusterIP
  selector:
    app: sre-simulator
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP

---
# Route (OpenShift specific)
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: sre-simulator
  namespace: sre-simulator
  labels:
    app: sre-simulator
spec:
  host: sre-simulator.apps.example.com
  to:
    kind: Service
    name: sre-simulator
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

---
# Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sre-simulator
  namespace: sre-simulator
  labels:
    app: sre-simulator

---
# ConfigMap for application configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: sre-simulator-config
  namespace: sre-simulator
  labels:
    app: sre-simulator
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"

---
# Pod Disruption Budget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sre-simulator
  namespace: sre-simulator
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: sre-simulator

---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sre-simulator
  namespace: sre-simulator
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sre-simulator
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max
